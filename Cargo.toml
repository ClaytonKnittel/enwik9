[package]
name = "enwik9"
version = "0.1.0"
edition = "2024"

[lints.clippy]
borrow_as_ptr = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["fs", "stdio"] }
